
name: 🔄 Sync Upstream & Auto Deploy

on:
  schedule:
    # 每天北京时间 10:00 (UTC 02:00) 自动检查上游更新
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: 🔄 Sync Upstream
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync-step.outputs.changed }}
      upstream_sha: ${{ steps.sync-step.outputs.upstream_sha }}
      revision: ${{ steps.sync-step.outputs.revision }}

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: 🔀 Fetch & Sync Upstream Tree
        id: sync-step
        shell: bash
        run: |
          set -euo pipefail

          target_branch="main"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. 备份当前 Fork 仓库专属的工作流文件
          mkdir -p /tmp/wf-backup
          cp -a .github/workflows/. /tmp/wf-backup/

          # 2. 拉取上游 maillab/cloud-mail 最新提交
          git remote add upstream https://github.com/maillab/cloud-mail.git 2>/dev/null || git remote set-url upstream https://github.com/maillab/cloud-mail.git
          git fetch upstream main
          upstream_sha="$(git rev-parse upstream/main)"

          # 3. 将工作区与暂存区完整更新为上游代码树 (同步业务代码)
          git restore --source upstream/main --staged --worktree :/

          # 4. 强制还原 Fork 仓库自身的工作流，杜绝上游 CI 污染和 GitHub 权限拦截
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/wf-backup/. .github/workflows/
          git checkout HEAD -- .github/workflows

          # 5. 检查业务代码是否有实质更新
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "✅ 本地业务代码已与上游最新版保持一致，无需提交 (Upstream: ${upstream_sha:0:7})"
            exit 0
          fi

          # 6. 仅提交业务代码变更（不含任何 workflow 修改，git push 100% 成功）
          git commit -m "chore: sync upstream ${upstream_sha:0:7}"
          git push origin "HEAD:${target_branch}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "✅ 成功同步上游代码并推送到 main 分支。"

  deploy:
    name: 🚀 Trigger Cloudflare Deploy
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy-cloudflare.yml
    secrets: inherit
